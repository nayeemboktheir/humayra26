# Staging instance for tradeon.global — a separate VPS deployment.
#
# This used to also run a Node `cache-api` + Redis, with the frontend's search and
# product-detail calls routed to it through Caddy. That existed only because the
# Lovable-managed Supabase could not be deployed to, so caching had to live
# somewhere else. The backend is self-hosted now, and the edge functions already
# implement the same cache-aside against Postgres (`search_cache`, `product_cache`,
# 12h TTL) — measured 3.03s cold vs 0.23s warm, with no Redis involved.
#
# Keeping it meant maintaining `cache-api/src/tmapiMap.js` as a hand-copied port of
# the edge-function mapping. The two had already drifted and shipped broken product
# thumbnails to production search (AUDIT.md §8.1). Deleted rather than re-synced.
#
# Deployed via Coolify (build_pack: dockercompose), which runs its own Traefik reverse
# proxy already bound to host ports 80/443 and terminates TLS itself once a domain is
# assigned to this app in the Coolify UI. Containers here must NOT publish those ports —
# `expose:` puts the frontend container on Coolify's internal network only; Traefik
# reaches it there and handles the public-facing HTTPS side, including the certificate.
#
# See DEPLOY-STAGING.md for the full runbook (Coolify UI steps, not raw `docker compose`).

services:
  frontend:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    restart: unless-stopped
    expose:
      - "80"
