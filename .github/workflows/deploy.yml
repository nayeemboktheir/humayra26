name: Build & Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: bun run build

      - name: Verify build asset integrity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('dist/index.html').read_text()
          refs = re.findall(r'(?:src|href)=["\']/?(assets/[^"\']+\.(?:js|css))["\']', html)
          if not refs:
              raise SystemExit('No JS/CSS assets referenced by dist/index.html')
          missing = [ref for ref in refs if not Path('dist', ref).is_file()]
          if missing:
              raise SystemExit(f'Build references missing assets: {missing}')
          print(f'Validated {len(refs)} entry assets')
          PY

      - name: Verify .htaccess in dist
        run: |
          if [ -f dist/.htaccess ]; then
            echo "✅ .htaccess found in dist"
          else
            echo "⚠️ .htaccess missing, copying from public"
            cp public/.htaccess dist/.htaccess
          fi

      - name: Deploy to Hostinger FTP root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
          timeout: 60000

      - name: Force overwrite Hostinger web root
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib
          import os
          from pathlib import Path

          server = os.environ['FTP_SERVER']
          username = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']
          local_root = Path('dist')
          files = [p for p in local_root.rglob('*') if p.is_file()]

          def cwd_mkdirs(ftp, remote_dir):
              ftp.cwd('/')
              for part in [p for p in remote_dir.split('/') if p]:
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          def upload_target(remote_root):
              ftp = ftplib.FTP_TLS(timeout=60)
              ftp.connect(server, 21)
              ftp.login(username, password)
              ftp.prot_p()
              ftp.set_pasv(True)
              print(f'Overwriting dist files in /{remote_root or "."}')
              for path in files:
                  rel = path.relative_to(local_root)
                  parent = rel.parent.as_posix()
                  remote_dir = '/'.join(x for x in [remote_root.strip('/'), parent] if x)
                  cwd_mkdirs(ftp, remote_dir)
                  with path.open('rb') as handle:
                      ftp.storbinary(f'STOR {rel.name}', handle)
              ftp.quit()

          upload_target('')
          PY

      - name: Verify live site updated
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            VERIFY_ID="${GITHUB_SHA}-${attempt}-$(date +%s)"
            HTML="$(curl -fsSL -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://tradeon.global/?deploy_verify=${VERIFY_ID}" || true)"
            ASSET="$(printf '%s' "$HTML" | grep -oE '(src|href)="/?assets/[^"]+\.(js|css)"' | head -n 1 | sed -E 's/^[^=]+="\/?//; s/"$//' || true)"
            HEADERS=""
            if [ -n "$ASSET" ]; then
              HEADERS="$(curl -fsSI -H 'Cache-Control: no-cache' "https://tradeon.global/${ASSET}?deploy_verify=${VERIFY_ID}" || true)"
            fi

            if [ -n "$ASSET" ] \
              && printf '%s' "$HEADERS" | grep -qiE '^content-type: *(text/javascript|application/javascript|text/css)'; then
              echo "✅ tradeon.global is serving index.html and its referenced build asset"
              exit 0
            fi
            echo "Attempt $attempt: the live HTML or referenced asset is not ready; retrying..."
            sleep 15
          done
          echo "❌ tradeon.global is not serving its referenced JS/CSS asset with the correct MIME type." >&2
          exit 1
